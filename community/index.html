<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酷學習廣場 - 精緻社群交流</title>
    <link rel="icon" type="image/png" href="../images/logo-gold.png">
    
    <!-- 引用網站全局樣式 -->
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/header.css">
    
    <style>
        :root {
            --official-gold: #d97706;
            --official-light: #fffcf0;
            --official-border: #fde68a;
            --primary-soft: #eff6ff;
            --primary-deep: #0b76d1;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --card-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            --icon-stroke: 2.2px;
        }

        body { 
            background-color: #f8fafc; 
            padding-bottom: 120px; 
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        /* --- Header 修正：返回鈕與排版 --- */
        .back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            margin-right: 5px;
            border-radius: 12px;
            transition: background 0.2s;
            color: var(--primary-deep) !important;
        }
        .back-link:hover { background: var(--primary-soft); }

        /* --- 頂部導覽列 (毛玻璃過濾標籤) --- */
        .filter-wrapper {
            position: sticky;
            top: 75px;
            z-index: 1000;
            background: rgba(248, 250, 252, 0.9);
            backdrop-filter: blur(12px);
            padding: 12px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(226, 232, 240, 0.5);
        }

        .filter-tabs {
            display: flex; gap: 10px; overflow-x: auto; 
            max-width: 800px; margin: 0 auto; padding: 0 20px;
            scrollbar-width: none;
        }
        .filter-tabs::-webkit-scrollbar { display: none; }

        .tab {
            padding: 10px 20px; border-radius: 14px; background: #fff;
            border: 1.5px solid #e2e8f0; color: var(--text-sub); cursor: pointer;
            white-space: nowrap; font-weight: 700; transition: all 0.25s ease;
            font-size: 0.9rem; display: flex; align-items: center; gap: 8px;
        }
        .tab svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: var(--icon-stroke); }
        
        .tab:hover { border-color: var(--primary-deep); color: var(--primary-deep); background: var(--primary-soft); }
        .tab.active { background: var(--primary-deep); color: #fff; border-color: var(--primary-deep); box-shadow: 0 8px 15px -3px rgba(11, 118, 209, 0.3); }

        /* --- 貼文 Feed 區域 --- */
        .feed-container { display: flex; flex-direction: column; gap: 24px; max-width: 720px; margin: 0 auto; padding: 0 15px; }

        .post-card {
            background: #fff; border-radius: 28px; padding: 30px;
            border: 1px solid rgba(226, 232, 240, 0.8); position: relative;
            box-shadow: var(--card-shadow); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            animation: slideIn 0.5s ease-out backwards;
            user-select: none;
        }
        .post-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1); border-color: #cbd5e1; }
        
        .post-card.official-post {
            border: 1.5px solid var(--official-border);
            background: linear-gradient(165deg, #fff 60%, var(--official-light) 100%);
        }

        /* --- 右上角三點選單 --- */
        .post-options { position: absolute; top: 25px; right: 25px; z-index: 20; }
        .options-btn {
            background: none; border: none; color: var(--text-sub); padding: 8px;
            cursor: pointer; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .options-btn:hover { background: var(--primary-soft); color: var(--primary-deep); }
        .options-menu {
            position: absolute; top: 100%; right: 0; background: #fff;
            border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 1px solid #e2e8f0; min-width: 130px; display: none; margin-top: 5px;
        }
        .options-menu.show { display: block; animation: menuIn 0.2s ease-out; }
        .menu-item {
            width: 100%; padding: 12px 18px; border: none; background: none;
            text-align: left; font-size: 0.9rem; font-weight: 700; cursor: pointer;
            color: var(--text-main); display: flex; align-items: center; gap: 10px;
        }
        .menu-item:hover { background: var(--primary-soft); color: var(--primary-deep); }
        .menu-item.delete { color: #ef4444; }
        .menu-item.delete:hover { background: #fee2e2; }

        @keyframes menuIn { from { opacity:0; transform: translateY(-10px); } to { opacity:1; transform: translateY(0); } }

        /* --- 貼文內容 --- */
        .post-header { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
        .author-avatar { width: 46px; height: 46px; border-radius: 15px; background: #f1f5f9; border: 2px solid #fff; box-shadow: 0 4px 8px rgba(0,0,0,0.05); object-fit: cover; }
        .author-info { display: flex; flex-direction: column; justify-content: center; flex: 1; }
        .author-name { font-weight: 800; color: var(--text-main); font-size: 1.05rem; display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
        .post-meta { font-size: 0.8rem; color: var(--text-sub); display: flex; align-items: center; gap: 4px; }
        .post-meta svg { width: 14px !important; height: 14px !important; stroke-width: 2.2px; }

        .badge { font-size: 0.65rem; padding: 3px 10px; border-radius: 6px; font-weight: 900; letter-spacing: 0.5px; }
        .badge-official { background: var(--official-gold); color: #fff; }
        .badge-subject { background: var(--primary-soft); color: var(--primary-deep); }

        .post-title { font-size: 1.45rem; font-weight: 900; color: var(--text-main); margin-bottom: 14px; line-height: 1.35; }
        .post-content { font-size: 1.05rem; color: #334155; line-height: 1.8; word-break: break-all; }

        /* --- 底部按鈕列 (及時按讚) --- */
        .post-footer { margin-top: 25px; padding-top: 20px; border-top: 1px solid #f1f5f9; display: flex; gap: 15px; }
        .action-btn {
            background: #fff; border: 1px solid #e2e8f0; border-radius: 100px;
            padding: 6px 18px; cursor: pointer; color: var(--text-sub);
            font-size: 1.1rem; display: flex; align-items: center; gap: 10px; font-weight: 600;
            transition: all 0.2s ease; position: relative; z-index: 5;
        }
        .action-btn svg { width: 20px; height: 20px; stroke: var(--text-sub); stroke-width: 2.2px; fill: none; transition: 0.2s; }
        .action-btn:hover { background: #f8fafc; border-color: #cbd5e1; transform: scale(1.05); }
        .action-btn.liked { border-color: #ef4444; color: #ef4444; }
        .action-btn.liked svg { stroke: #ef4444; fill: #ef4444; transform: scale(1.1); }

        /* --- 發布鈕 (FAB) --- */
        .fab {
            position: fixed; bottom: 35px; right: 35px;
            width: 64px; height: 64px; background: var(--primary-deep);
            color: #fff; border-radius: 22px; display: flex; align-items: center;
            justify-content: center; box-shadow: 0 12px 25px -5px rgba(11, 118, 209, 0.5);
            cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 1000;
        }
        .fab:hover { transform: scale(1.1) rotate(90deg); }
        .fab svg { stroke: #fff; fill: none; stroke-width: 3.5px; width: 28px; height: 28px; }

        /* --- 發布彈窗 --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(10px); display: none; align-items: center;
            justify-content: center; z-index: 2000; padding: 20px;
        }
        .modal-card {
            background: #fff; width: 100%; max-width: 580px; border-radius: 35px;
            padding: 40px; box-shadow: 0 30px 60px -12px rgba(0,0,0,0.35);
            animation: modalIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalIn { from { opacity:0; transform: scale(0.9) translateY(40px); } to { opacity:1; transform: scale(1) translateY(0); } }

        .modal-card select, .modal-card input, .modal-card textarea {
            width: 100%; border: 2px solid #f1f5f9; border-radius: 18px;
            padding: 16px 20px; font-size: 1rem; margin-bottom: 18px; outline: none;
            font-family: inherit; box-sizing: border-box; background: #f8fafc;
        }
        .modal-card textarea { height: 180px; resize: none; }
        .btn-send { background: var(--primary-deep); color: #fff; border: none; padding: 14px 35px; border-radius: 16px; font-weight: 800; cursor: pointer; }

        @media (max-width: 600px) {
            .post-card { padding: 25px 20px; border-radius: 22px; }
            .filter-wrapper { top: 70px; }
            .modal-card { padding: 30px 20px; border-radius: 28px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <a href="../index.html" class="back-link" title="回首頁">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </a>
            <span class="header-title-area">廣場 Feed</span>
        </div>
        <div class="header-right" id="header-user-area"></div>
    </header>

    <div class="filter-wrapper">
        <div class="filter-tabs">
            <div class="tab active" onclick="switchFilter('all', this)">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                全部
            </div>
            <div class="tab" onclick="switchFilter('official', this)">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                公告
            </div>
            <div class="tab" onclick="switchFilter('english', this)">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                英文
            </div>
            <div class="tab" onclick="switchFilter('chinese', this)">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                國文
            </div>
            <div class="tab" onclick="switchFilter('science', this)">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l-5.5 9h11L12 2zm0 3.84L13.93 9h-3.87L12 5.84zM17.5 13c-2.49 0-4.5 2.01-4.5 4.5s2.01 4.5 4.5 4.5 4.5-2.01 4.5-4.5-2.01-4.5-4.5-4.5zM3 21.5h8v-8H3v8z"></path></svg>
                科學
            </div>
        </div>
    </div>

    <main class="feed-container" id="feed-root">
        <div style="text-align:center; padding:100px 0; color:var(--text-sub); font-weight:bold; opacity:0.4;">同步中...</div>
    </main>

    <div class="fab" id="open-post-modal" title="發布話題"><svg width="28" height="28" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>

    <div id="post-modal" class="modal-overlay">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h2 style="margin:0 0 30px 0; font-weight:900;">發布話題</h2>
            <select id="post-subject">
                <option value="general">一般話題 / 閒聊</option>
                <option value="english">英文學科討論</option>
                <option value="chinese">國文學科交流</option>
                <option value="science">科學探索研究</option>
            </select>
            <input type="text" id="post-title" placeholder="標題">
            <textarea id="post-content" placeholder="內容 (支援 Markdown)"></textarea>
            <div style="display:flex; justify-content:flex-end; gap:15px; align-items:center;">
                <button style="background:none; border:none; color:var(--text-sub); cursor:pointer; font-weight:700;" onclick="closeModal()">取消</button>
                <button class="btn-send" id="submit-post-btn">發布貼文</button>
            </div>
        </div>
    </div>

    <!-- 依序引入腳本 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../scripts/supabase-config.js"></script>
    <script src="../scripts/utils.js"></script>
    <script src="../scripts/auth-helper.js"></script>
    <script src="../scripts/community.js"></script>
    
    <script>
        // 點擊背景關閉 Modal
        document.getElementById('post-modal').onclick = closeModal;
        function closeModal() { document.getElementById('post-modal').style.display = 'none'; }
        window.closeModal = closeModal;
    </script>
</body>
</html>
