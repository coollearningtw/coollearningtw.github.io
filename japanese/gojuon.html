<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五十音圖全集 - 酷學習</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/header.css">
    <!-- 引入日文字體：標準與手寫質感 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;900&family=Klee+One:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --jp-primary: #db2777;
            --jp-light: #fce7f3;
            --jp-bg: #fff5f7;
            --jp-card: #ffffff;
        }

        body { background-color: var(--jp-bg); padding-bottom: 50px; }

        /* 頂部導覽列風格同步 */
        header {
            background-color: var(--jp-light) !important;
            /* 這裡使用 border 而不是 border-bottom，並強制覆蓋全域樣式 */
            border: 2px solid var(--jp-primary) !important; 
        }
        .header-title-area, .back-link { color: var(--jp-primary) !important; }

        /* 類別切換標籤 */
        .type-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px auto;
            max-width: 600px;
            background: #f1f5f9;
            padding: 5px;
            border-radius: 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            color: #64748b;
            transition: 0.3s;
            font-size: 0.95rem;
        }
        .tab-btn.active {
            background: var(--jp-primary);
            color: #fff;
            box-shadow: 0 4px 10px rgba(219, 39, 119, 0.2);
        }

        /* 控制項 (假名/字體) */
        .controls-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .control-group {
            display: flex;
            background: #fff;
            padding: 4px;
            border-radius: 50px;
            border: 1.5px solid #fbcfe8;
        }
        .mode-btn {
            padding: 6px 18px;
            border-radius: 50px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--jp-primary);
            transition: 0.2s;
        }
        .mode-btn.active {
            background: var(--jp-light);
            box-shadow: inset 0 0 0 1px var(--jp-primary);
        }

        /* 網格容器 */
        .gojuon-container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(219, 39, 119, 0.05);
            border: 1px solid #fbcfe8;
            overflow-x: auto;
        }

        /* 動態網格佈局 */
        .gojuon-grid {
            display: grid;
            gap: 12px;
            width: 100%;
            margin: 0 auto;
            /* 預設為清音/濁音的 5 欄佈局 */
            grid-template-columns: repeat(5, 1fr);
        }
        .gojuon-grid.yoon-grid {
            /* 拗音使用 3 欄佈局 */
            grid-template-columns: repeat(3, 1fr);
            max-width: 540px;
        }

        /* 假名卡片 */
        .kana-card {
            background: #fff;
            border: 1.5px solid #f1f5f9;
            border-radius: 18px;
            padding: 15px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 90px;
            position: relative;
        }
        .kana-card:hover {
            border-color: var(--jp-primary);
            background-color: var(--jp-light);
            transform: translateY(-3px);
        }
        .kana-card:active { transform: scale(0.95); }

        .char {
            font-size: 2.2rem;
            color: #1e293b;
            line-height: 1.1;
            margin-bottom: 5px;
        }
        /* 字體類別 */
        .font-standard { font-family: 'Noto Sans JP', sans-serif; font-weight: 500; }
        .font-hand { font-family: 'Klee One', cursive; font-weight: 600; }

        .romaji {
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 播放圖示提示 */
        .play-hint {
            position: absolute;
            top: 8px;
            right: 8px;
            opacity: 0.2;
            color: var(--jp-primary);
        }
        .kana-card:hover .play-hint { opacity: 0.6; }

        @media (max-width: 600px) {
            .gojuon-container { padding: 15px 10px; border-radius: 20px; }
            .gojuon-grid { gap: 8px; }
            .char { font-size: 1.6rem; }
            .kana-card { min-height: 75px; border-radius: 12px; }
            .type-tabs { margin: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html" class="back-link">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </a>
            <span class="header-title-area">五十音互動圖表</span>
        </div>
    </header>

    <div class="page-container">
        
        <!-- 頂部類別切換 -->
        <div class="type-tabs">
            <button class="tab-btn active" onclick="switchType('seion')">清音</button>
            <button class="tab-btn" onclick="switchType('dakuon')">濁音 / 半濁音</button>
            <button class="tab-btn" onclick="switchType('yoon')">拗音</button>
        </div>

        <!-- 輔助控制項 -->
        <div class="controls-row">
            <div class="control-group">
                <button id="mode-h" class="mode-btn active" onclick="switchMode('h')">平假名 あ</button>
                <button id="mode-k" class="mode-btn" onclick="switchMode('k')">片假名 ア</button>
            </div>
            <div class="control-group">
                <button id="font-std" class="mode-btn active" onclick="switchFont(false)">標準體</button>
                <button id="font-hand" class="mode-btn" onclick="switchFont(true)">手寫體</button>
            </div>
        </div>

        <!-- 五十音圖主體 -->
        <div class="gojuon-container">
            <div id="grid-root" class="gojuon-grid">
                <!-- 由 JS 動態渲染 -->
            </div>
        </div>

        <p style="text-align:center; color:#94a3b8; font-size:0.85rem; margin-top:25px; font-weight:bold;">
            ※ 點擊方塊聽取發音，使用手寫體可練習辨識書寫形態
        </p>

    </div>

    <script src="../scripts/utils.js"></script>
    <script>
        let fullData = null;
        let currentType = 'seion'; // seion, dakuon, yoon
        let currentMode = 'h';     // h: hiragana, k: katakana
        let isHandwritten = false;

        async function init() {
            try {
                const res = await fetch('https://raw.githubusercontent.com/coollearningtw/cool-learning-data/refs/heads/main/gojuon.json');
                fullData = await res.json();
                render();
            } catch (err) {
                console.error("無法載入五十音資料", err);
            }
        }

        function render() {
            if (!fullData) return;
            const container = document.getElementById('grid-root');
            container.innerHTML = '';
            
            // 處理佈局樣式
            container.className = `gojuon-grid ${currentType === 'yoon' ? 'yoon-grid' : ''}`;

            const items = fullData[currentType];
            const fontClass = isHandwritten ? 'font-hand' : 'font-standard';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'kana-card';
                
                // 設定 Grid 座標
                card.style.gridRow = item.row;
                card.style.gridColumn = item.col;

                const displayChar = (currentMode === 'h') ? item.h : item.k;

                card.innerHTML = `
                    <div class="play-hint">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                    <div class="char ${fontClass}">${displayChar}</div>
                    <div class="romaji">${item.r}</div>
                `;

                card.onclick = () => {
                    // 呼叫 utils.js 中的 speak 函式
                    speak(item.h, 'ja-JP', 0.9);
                };

                container.appendChild(card);
            });
        }

        // --- 切換邏輯 ---

        function switchType(type) {
            currentType = type;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(type === 'seion' ? '清音' : type === 'yoon' ? '拗音' : '濁音'));
            });
            // 修正：針對手動傳入字串判斷
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                const types = ['seion', 'dakuon', 'yoon'];
                btn.classList.toggle('active', types[idx] === type);
            });
            render();
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('mode-h').classList.toggle('active', mode === 'h');
            document.getElementById('mode-k').classList.toggle('active', mode === 'k');
            render();
        }

        function switchFont(hand) {
            isHandwritten = hand;
            document.getElementById('font-std').classList.toggle('active', !hand);
            document.getElementById('font-hand').classList.toggle('active', hand);
            render();
        }

        init();
    </script>
</body>
</html>
