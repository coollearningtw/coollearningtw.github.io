<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人檔案與組織管理 - 酷學習</title>
    <link rel="icon" type="image/png" href="images/logo-gold.png">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/header.css">
    <style>
        /* 統一雙欄網格佈局 */
        .profile-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
            transition: all 0.3s ease;
        }

        /* 向量圖標基本設定 */
        .panel-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
            flex-shrink: 0;
            display: inline-block;
            vertical-align: middle;
        }

        .panel-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary);
            margin: 0 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #f1f5f9;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: bold;
            color: #475569;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            background: #f8fafc;
            transition: 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .form-control:disabled {
            background: #e2e8f0;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
        }

        /* 密碼切換按鈕樣式 */
        .password-input-wrapper { position: relative; display: flex; align-items: center; }
        .password-toggle-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #94a3b8; display: flex; align-items: center; }

        /* 頭像編輯區 */
        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
            position: relative;
        }
        .avatar-preview-box {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid var(--primary-light);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            background-color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
        }
        .avatar-preview-box:hover {
            filter: brightness(0.9);
            border-color: var(--primary);
        }
        .avatar-preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar-upload-input { display: none; }
        .avatar-hint { font-size: 0.75rem; color: #94a3b8; margin-top: 8px; font-weight: bold; }

        /* --- 組織管理專用樣式 --- */
        .role-badge { padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; margin-left: 5px; }
        .role-owner { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .role-admin { background: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }
        .role-member { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }

        .member-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; }
        .member-table td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }

        /* 權限設定 UI 樣式 */
        .perm-group { margin-top: 10px; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; }
        .perm-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #fff; border-bottom: 1px solid #f1f5f9; }
        .perm-row:last-child { border-bottom: none; }
        .perm-label { font-size: 0.8rem; font-weight: bold; color: #475569; }
        .perm-options { display: flex; gap: 5px; }
        .perm-btn { font-size: 0.7rem; padding: 3px 6px; border-radius: 4px; border: 1px solid #cbd5e1; cursor: pointer; background: #fff; }
        .perm-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        /* ----------------------- */

        .msg-box { font-size: 0.85rem; padding: 10px; border-radius: 6px; margin-bottom: 15px; display: none; }
        .msg-box.error { display: block !important; background: #fee2e2; color: #ef4444; font-weight: bold; border: 1px solid #fecaca; }
        .msg-box.success { display: block !important; background: #dcfce7; color: #166534; font-weight: bold; border: 1px solid #bbf7d0; }

        .tool-link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: #fff;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            text-decoration: none;
            color: #1e293b;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .tool-link-card:hover { border-color: var(--primary); background-color: var(--primary-light); transform: translateX(4px); }

        .locked-info { font-size: 0.7rem; color: #ef4444; margin-top: 4px; display: block; font-weight: bold; }
        #invite-banner { display: none; background: #fffbeb; border: 1px solid #fef3c7; border-radius: 12px; padding: 20px; margin: 0 auto 20px; max-width: 1000px; align-items: center; justify-content: space-between; gap: 15px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); display: none; align-items: center; justify-content: center; z-index: 3000; backdrop-filter: blur(4px); }
        .modal-content { background: #fff; padding: 30px; border-radius: 16px; width: 90%; max-width: 450px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
        .modal-footer { display: flex; gap: 10px; margin-top: 20px; }

        @media (max-width: 820px) { .profile-layout { grid-template-columns: 1fr !important; } }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html" class="back-link">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </a>
            <img src="images/logo.png" alt="Logo" height="40">
            <span class="header-title-area">個人設定與組織中心</span>
        </div>
        <div class="header-right">
            <button class="btn-tool-text" onclick="handleLogout()">登出帳號</button>
        </div>
    </header>

    <main class="page-container">
        
        <div id="invite-banner">
            <div style="display:flex; align-items:center; gap:12px;">
                <svg class="panel-icon" style="color:#d97706; width:28px; height:28px;" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16l-2-2v-5z"/></svg>
                <div>
                    <div style="font-weight: 800; color: #92400e;">您有一項組織加入邀請</div>
                    <div id="invite-text" style="font-size: 0.85rem; color: #78350f;">---</div>
                </div>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn" style="background:#f1f5f9; color:#475569; border:1px solid #cbd5e1; padding:8px 16px;" onclick="processInvite('reject')">拒絕</button>
                <button class="btn" style="background:#10b981; color:white; border:none; padding:8px 16px;" onclick="processInvite('accept')">接受邀請</button>
            </div>
        </div>

        <div class="profile-layout">
            <section class="std-card" style="padding: 25px; height: fit-content;">
                <h2 class="panel-title">
                    <svg class="panel-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    個人資訊設定
                </h2>
                <div id="profile-msg" class="msg-box"></div>

                <div class="avatar-section">
                    <div class="avatar-preview-box" onclick="triggerAvatarUpload()" title="點擊上傳新頭像">
                        <img id="avatar-img-preview" src="https://api.dicebear.com/7.x/bottts/svg?seed=default" alt="頭像">
                    </div>
                    <input type="file" id="avatar-file-input" class="avatar-upload-input" accept="image/*" onchange="uploadAvatar(event)">
                    <span class="avatar-hint">點擊頭像可上傳新圖片 (限制 2MB 以下)</span>
                </div>

                <div class="form-group">
                    <label>我的帳號識別碼 (User ID)</label>
                    <input type="text" id="user-id-display" class="form-control" readonly style="font-family: monospace; background:#f1f5f9; cursor:text;" onclick="this.select()">
                </div>

                <div class="form-group">
                    <label for="prof-customid">專屬帳號 ID (用於登入)</label>
                    <input type="text" id="prof-customid" class="form-control" placeholder="例如：alex.123">
                    <span id="id-lock-msg" class="locked-info" style="display:none;">組織成員或受控帳號無法修改 ID</span>
                </div>

                <div class="form-group">
                    <label for="prof-username">顯示名稱 (公開展示姓名)</label>
                    <input type="text" id="prof-username" class="form-control" placeholder="請輸入暱稱">
                    <span id="nickname-lock-msg" class="locked-info" style="display:none;">管理員已鎖定暱稱修改功能</span>
                </div>

                <div class="form-group" style="background: #f8fafc; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0;">
                    <label style="color: var(--primary);">修改個人密碼</label>
                    <input type="password" id="prof-new-password" class="form-control" placeholder="若不修改請留空">
                    <small style="color: #94a3b8;">密碼需大於 6 位數</small>
                </div>

                <div class="form-group">
                    <label for="prof-county">就讀縣市</label>
                    <select id="prof-county" class="form-control" onchange="handleCountyChange('prof')"></select>
                </div>

                <div class="form-group">
                    <label for="prof-stage">學習階段</label>
                    <select id="prof-stage" class="form-control" onchange="handleStageChange('prof')" disabled></select>
                </div>

                <div class="form-group">
                    <label for="prof-school">學校名稱</label>
                    <select id="prof-school" class="form-control" disabled></select>
                    <span id="academic-lock-msg" class="locked-info" style="display:none;">組織成員或受控帳號無法自行修改就學資訊</span>
                </div>

                <button class="btn btn-submit" id="btn-save-profile" onclick="saveProfile()" style="background:#0b76d1; color:white; border:none; margin-top:10px;">儲存修改</button>

                <div id="danger-zone-area" style="margin-top: 35px; border-top: 2px dashed #f1f5f9; padding-top: 25px;">
                    <div style="background: #fff5f5; border: 1px solid #fecaca; border-radius: 12px; padding: 18px; text-align: left;">
                        <div style="font-weight: 800; color: #991b1b; font-size: 0.9rem; margin-bottom: 6px; display: flex; align-items: center; gap: 6px;">
                            <svg class="panel-icon" style="color:#ef4444; width:18px; height:18px;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                            安全警戒：危險區域
                        </div>
                        <p style="font-size: 0.8rem; color: #b91c1c; margin: 0 0 12px 0; line-height: 1.5; font-weight: 500;">此操作將徹底註銷帳號，無法復原。</p>
                        <button onclick="deleteMyAccount()" style="width: 100%; padding: 11px; background: #ef4444; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">註銷並永久刪除我的帳號</button>
                    </div>
                </div>
            </section>

            <section class="std-card" id="org-panel" style="padding: 25px; height: fit-content;"></section>
        </div>
    </main>

    <!-- 編輯成員資料的 Modal -->
    <div id="edit-member-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 class="panel-title" style="border:none; margin-bottom:15px;">管理成員資料</h3>
            <div id="modal-msg" class="msg-box"></div>
            <input type="hidden" id="edit-m-uid">
            <input type="hidden" id="edit-m-mid">

            <!-- 【創立者專用】管理權限面板 -->
            <div id="owner-permission-editor" style="display:none; margin-bottom:20px;">
                <button class="btn" style="width:100%; background:#f8fafc; border:1px solid #e2e8f0; color:var(--primary); font-size:0.85rem; padding:8px;" onclick="togglePermEditor()">⚙️ 設定管理員權限</button>
                <div id="perm-editor-content" style="display:none; background:#f8fafc; padding:12px; border-radius:0 0 10px 10px; border:1px solid #e2e8f0; border-top:none;">
                    <div id="role-select-area" class="form-group">
                        <label>成員身分角色</label>
                        <select id="edit-m-role" class="form-control" style="padding:5px 10px; height:auto;">
                            <option value="member">一般成員</option>
                            <option value="admin">管理員</option>
                        </select>
                    </div>
                    <div id="perm-settings-list" class="perm-group"></div>
                </div>
            </div>
            
            <div id="field-uuid" class="form-group"><label>User ID (系統識別碼)</label><input type="text" id="edit-m-uuid" class="form-control" readonly style="font-size:0.7rem; font-family:monospace; background:#f1f5f9;"></div>
            
            <div id="managed-fields-editor">
                <div id="field-customid" class="form-group"><label>帳號 ID (登入帳號)</label><input type="text" id="edit-m-customid" class="form-control"></div>
                <div id="field-password" class="form-group" style="background: #fff5f5; padding: 12px; border-radius: 8px; border: 1px solid #fecaca;"><label style="color:#b91c1c;">重設成員密碼</label><input type="text" id="edit-m-password" class="form-control" placeholder="輸入新密碼"></div>
            </div>

            <div id="field-username" class="form-group"><label>顯示名稱</label><input type="text" id="edit-m-username" class="form-control"></div>
            <div id="field-academic" class="form-group">
                <label>學籍資訊</label>
                <select id="edit-m-county" class="form-control" onchange="handleCountyChange('edit-m')" style="margin-bottom:8px;"></select>
                <select id="edit-m-stage" class="form-control" onchange="handleStageChange('edit-m')" style="margin-bottom:8px;"><option value="">選擇...</option><option value="國中">國中</option><option value="高中">高中</option></select>
                <select id="edit-m-school" class="form-control"></select>
            </div>
            <div class="modal-footer">
                <button class="btn" style="background:#f1f5f9; color:#475569; border:1px solid #cbd5e1; flex:1;" onclick="closeMemberModal()">取消</button>
                <button class="btn" id="modal-save-btn" style="background:#0b76d1; color:white; border:none; flex:1;" onclick="saveMemberProfile()">儲存變更</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase-config.js"></script>

    <script>
        let currentUser = null, allSchools = [], originalCustomId = "", userIsMember = false, pendingInvite = null;
        const RANK = { 'owner': 3, 'admin': 2, 'member': 1, 'none': 0 };

        async function init() {
            try {
                const { data: { user } } = await window.supabaseClient.auth.getUser();
                if (!user) { window.location.href = 'auth/login.html'; return; }
                currentUser = user;

                const { data: schoolData } = await window.supabaseClient.from('schools').select('id, county, stage, name').in('stage', ['國中', '高中']);
                allSchools = schoolData || [];
                const counties = [...new Set(allSchools.map(s => s.county))].sort();
                ['prof', 'edit-m', 'reg-m'].forEach(p => {
                    const sel = document.getElementById(p + '-county');
                    if (sel) { sel.innerHTML = '<option value="">選擇縣市...</option>'; counties.forEach(c => sel.add(new Option(c, c))); }
                });

                const { data: profile } = await window.supabaseClient.from('profiles').select('*').eq('id', user.id).single();
                const { data: membership } = await window.supabaseClient.from('organization_members').select('*, organization:organizations(*)').eq('user_id', user.id).maybeSingle();

                if (membership) {
                    if (membership.status === 'invited') {
                        pendingInvite = membership;
                        document.getElementById('invite-banner').style.display = 'flex';
                        document.getElementById('invite-text').innerText = `「${membership.organization?.name || '未知組織'}」邀請您加入。`;
                    }
                    userIsMember = (membership.role !== 'owner' && membership.status === 'active');
                }

                document.getElementById('user-id-display').value = user.id;
                document.getElementById('prof-username').value = profile?.username || '';
                document.getElementById('prof-customid').value = profile?.custom_id || '';
                document.getElementById('avatar-img-preview').src = profile?.avatar_url || `https://api.dicebear.com/7.x/bottts/svg?seed=${user.id}`;

                if (profile?.county) {
                    document.getElementById('prof-county').value = profile.county; handleCountyChange('prof');
                    document.getElementById('prof-stage').value = profile.stage || ''; handleStageChange('prof');
                    document.getElementById('prof-school').value = profile.school_id || '';
                }

                if (userIsMember && membership) {
                    ['prof-county', 'prof-stage', 'prof-school', 'prof-customid'].forEach(id => document.getElementById(id).disabled = true);
                    document.getElementById('academic-lock-msg').style.display = 'block';
                    document.getElementById('id-lock-msg').style.display = 'block';
                    if (membership.is_managed) document.getElementById('danger-zone-area').style.display = 'none';
                }
                loadOrganizationCenter(profile, membership);
            } catch (err) { console.error(err); }
        }

        async function loadOrganizationCenter(profile, membership) {
            const panel = document.getElementById('org-panel');
            panel.innerHTML = '';
            renderLearningStatsBox(profile);
            const { data: ownedOrg } = await window.supabaseClient.from('organizations').select('*').eq('owner_id', currentUser.id).maybeSingle();
            if (ownedOrg || (membership?.role === 'admin' && membership.status === 'active')) {
                const oid = ownedOrg ? ownedOrg.id : membership.organization_id;
                const orgName = ownedOrg ? ownedOrg.name : membership.organization.name;
                const myRole = ownedOrg ? 'owner' : 'admin';
                appendManagementUI(oid, orgName, myRole, ownedOrg, membership);
            } else if (membership && membership.status === 'active') {
                appendJoinedOrgInfo(membership);
            }
        }

        function togglePermEditor() {
            const content = document.getElementById('perm-editor-content');
            content.style.display = content.style.display === 'none' ? 'block' : 'none';
        }

        async function appendManagementUI(oid, orgName, myRole, orgConfig, myMembership) {
            const area = document.getElementById('org-append-area');
            let h = `<div style="margin-top:40px; padding-top:30px; border-top: 2px solid #f1f5f9;"><h2 class="panel-title">組織管理：${orgName}</h2>`;
            if (myRole === 'owner') h += `<div style="background:#f8fafc; border:1px solid #e2e8f0; padding:15px; border-radius:12px; margin-bottom:15px;"><label style="display:flex; align-items:center; gap:10px; cursor:pointer; font-size:0.85rem; font-weight:bold; color:#475569;"><input type="checkbox" ${orgConfig.allow_member_nickname_edit ? 'checked' : ''} onchange="updateOrgConfig('${oid}', 'allow_member_nickname_edit', this.checked)">允許成員自行修改顯示名稱</label></div>`;
            h += `<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;"><button class="btn" style="background:#10b981; color:white; border:none;" onclick="showAddArea('invite')">邀請現有用戶</button><button class="btn" style="background:var(--primary); color:white; border:none;" onclick="showAddArea('create')">預先註冊帳號</button></div>
                <div id="add-form-area" style="display:none; background:#f8fafc; padding:20px; border-radius:12px; border:1px dashed #cbd5e1; margin-bottom:20px;"></div>
                <h3 style="margin-top:30px; font-size:1.1rem; color:#1e293b;">成員列表</h3><div id="mlist">讀取中...</div></div>`;
            area.innerHTML = h;
            loadMList(oid, myRole, myMembership);
        }

        async function loadMList(oid, myRole, myMembership) {
            const { data: org } = await window.supabaseClient.from('organizations').select('owner_id').eq('id', oid).single();
            const { data: ms } = await window.supabaseClient.from('organization_members').select('*, profile:profiles(*)').eq('organization_id', oid);
            const sorted = ms.sort((a,b) => (a.user_id === currentUser.id ? -1 : (a.user_id === org.owner_id ? 3 : RANK[a.role]) - (b.user_id === org.owner_id ? 3 : RANK[b.role])));
            const myRank = (org.owner_id === currentUser.id) ? 3 : RANK[myRole];
            let h = `<table class="member-table"><tbody>`;
            sorted.forEach(m => {
                const targetRank = (m.user_id === org.owner_id) ? 3 : RANK[m.role];
                const isSelf = m.user_id === currentUser.id;
                let roleTag = `<span class="role-badge ${m.user_id === org.owner_id?'role-owner':(m.role==='admin'?'role-admin':'role-member')}">${m.user_id===org.owner_id?'創立者':(m.role==='admin'?'管理員':'成員')}</span>`;
                h += `<tr><td><strong>${m.profile?.username || '(受邀中)'}${isSelf?' (您)':''}</strong>${roleTag}<br><small>${m.profile?.custom_id || '---'}</small></td><td style="text-align:right;">`;
                if (!isSelf && myRank > targetRank) {
                    const myPerms = JSON.stringify(myMembership?.admin_permissions || {});
                    h += `<button class="btn" style="padding:4px 8px; font-size:0.8rem;" onclick='openMModal("${m.user_id}", ${m.is_managed}, "${m.role}", "${m.id}", ${myRank}, ${myPerms})' ${m.status!=='active'?'disabled':''}>✎</button> `;
                    h += `<button class="btn" style="padding:4px 8px; font-size:0.8rem; color:red;" onclick="removeM('${m.user_id}','${m.id}','${oid}',${m.is_managed})">✕</button>`;
                }
                h += `</td></tr>`;
            });
            document.getElementById('mlist').innerHTML = h + `</tbody></table>`;
        }

        const PERM_FIELDS = [{ id: 'customid', label: '帳號 ID (登入用)' }, { id: 'username', label: '顯示名稱 (暱稱)' }, { id: 'academic', label: '學籍資訊 (縣市學校)' }, { id: 'uuid', label: 'User ID (查看權)' }];

        function renderPermSettings(currentPerms = {}) {
            const container = document.getElementById('perm-settings-list');
            container.innerHTML = '';
            PERM_FIELDS.forEach(field => {
                const val = currentPerms[field.id] || 'control';
                container.innerHTML += `<div class="perm-row"><span class="perm-label">${field.label}</span><div class="perm-options">
                    <button class="perm-btn ${val==='control'?'active':''}" onclick="setPermUI('${field.id}','control')">控制</button>
                    <button class="perm-btn ${val==='view'?'active':''}" onclick="setPermUI('${field.id}','view')">查看</button>
                    <button class="perm-btn ${val==='none'?'active':''}" onclick="setPermUI('${field.id}','none')">隱藏</button>
                </div><input type="hidden" id="perm-val-${field.id}" value="${val}"></div>`;
            });
        }

        function setPermUI(f, v) { 
            event.target.parentElement.querySelectorAll('.perm-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`perm-val-${f}`).value = v;
        }

        async function openMModal(uid, isManaged, targetRole, mid, myRank, myPerms = {}) {
            const { data: p } = await window.supabaseClient.from('profiles').select('*').eq('id', uid).single();
            const { data: m } = await window.supabaseClient.from('organization_members').select('admin_permissions').eq('id', mid).single();
            document.getElementById('edit-m-uid').value = uid;
            document.getElementById('edit-m-mid').value = mid;
            document.getElementById('edit-m-uuid').value = uid;
            document.getElementById('edit-m-username').value = p.username || '';
            document.getElementById('edit-m-customid').value = p.custom_id || '';
            document.getElementById('edit-m-county').value = p.county || ''; handleCountyChange('edit-m');
            document.getElementById('edit-m-stage').value = p.stage || ''; handleStageChange('edit-m');
            document.getElementById('edit-m-school').value = p.school_id || '';
            
            PERM_FIELDS.forEach(f => {
                const el = document.getElementById(`field-${f.id}`);
                el.style.display = 'block';
                el.querySelectorAll('input, select').forEach(i => i.disabled = false);
            });
            document.getElementById('modal-save-btn').style.display = 'block';
            document.getElementById('perm-editor-content').style.display = 'none'; // 每次打開重設隱藏

            if (myRank === 3) {
                document.getElementById('owner-permission-editor').style.display = 'block';
                document.getElementById('edit-m-role').value = targetRole;
                renderPermSettings(m?.admin_permissions || {});
            } else {
                document.getElementById('owner-permission-editor').style.display = 'none';
                PERM_FIELDS.forEach(f => {
                    const level = myPerms[f.id] || 'control';
                    const el = document.getElementById(`field-${f.id}`);
                    if (level === 'none') el.style.display = 'none';
                    else if (level === 'view') el.querySelectorAll('input, select').forEach(i => i.disabled = true);
                });
                const hasControl = Object.values(myPerms).some(v => v === 'control');
                if (!hasControl) document.getElementById('modal-save-btn').style.display = 'none';
            }
            document.getElementById('edit-member-modal').style.display = 'flex';
        }

        async function saveMemberProfile() {
            const uid = document.getElementById('edit-m-uid').value, mid = document.getElementById('edit-m-mid').value;
            const data = { username: document.getElementById('edit-m-username').value.trim(), custom_id: document.getElementById('edit-m-customid').value.trim().toLowerCase(), county: document.getElementById('edit-m-county').value, stage: document.getElementById('edit-m-stage').value, school_id: document.getElementById('edit-m-school').value };
            try {
                await window.supabaseClient.from('profiles').update(data).eq('id', uid);
                if (document.getElementById('owner-permission-editor').style.display === 'block') {
                    const perms = {}; PERM_FIELDS.forEach(f => perms[f.id] = document.getElementById(`perm-val-${f.id}`).value);
                    await window.supabaseClient.from('organization_members').update({ role: document.getElementById('edit-m-role').value, admin_permissions: perms }).eq('id', mid);
                }
                location.reload();
            } catch (e) { alert("儲存失敗"); }
        }

        // --- 其餘恢復原版邏輯 ---
        function renderLearningStatsBox(p) {
            const checkinDays = p?.checkin_count || 0;
            let n = 0, f = 0; try { n = JSON.parse(localStorage.getItem('cool_learning_notebooks') || '[]').length; f = JSON.parse(localStorage.getItem('my_favs') || '[]').length; } catch (e) {}
            document.getElementById('org-panel').innerHTML = `<h2 class="panel-title"><svg class="panel-icon" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>學習成就</h2>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 30px;">
                    <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; text-align: center;"><div style="font-size: 1.6rem; font-weight: 900; color: #ea580c;">${checkinDays}</div><div style="font-size: 0.72rem; color: #64748b; font-weight: bold;">連續簽到</div></div>
                    <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; text-align: center;"><div style="font-size: 1.6rem; font-weight: 900; color: #db2777;">${n}</div><div style="font-size: 0.72rem; color: #64748b; font-weight: bold;">雲端筆記</div></div>
                    <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; text-align: center;"><div style="font-size: 1.6rem; font-weight: 900; color: #0b76d1;">${f}</div><div style="font-size: 0.72rem; color: #64748b; font-weight: bold;">最愛單字</div></div>
                </div>
                <h3 style="font-size: 0.95rem; color: #475569; margin-bottom: 12px; font-weight: bold;">快捷通道</h3>
                <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px;">
                    <a href="tools/notebook.html" class="tool-link-card"><span>開啟虛擬筆記本</span><svg class="panel-icon" viewBox="0 0 24 24"><path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-8.29-1.42 1.42L16.86 11H5v2z"/></svg></a>
                    <a href="english/english-battle.html" class="tool-link-card"><span>進入單字對戰場</span><svg class="panel-icon" viewBox="0 0 24 24"><path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-8.29-1.42 1.42L16.86 11H5v2z"/></svg></a>
                </div><div id="org-append-area"></div>`;
        }

        function handleCountyChange(p) {
            const c = document.getElementById(p+'-county').value, st = document.getElementById(p+'-stage'), sc = document.getElementById(p+'-school');
            st.value = ''; sc.innerHTML = '<option value="">選擇學校...</option>';
            st.disabled = !c; sc.disabled = true;
        }

        function handleStageChange(p) {
            const c = document.getElementById(p+'-county').value, st = document.getElementById(p+'-stage').value, sc = document.getElementById(p+'-school');
            sc.innerHTML = '<option value="">選擇學校...</option>';
            if (c && st) {
                allSchools.filter(s => s.county === c && s.stage === st).sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant')).forEach(s => sc.add(new Option(s.name, s.id)));
                sc.disabled = false;
            } else sc.disabled = true;
        }

        async function saveProfile() {
            const d = { username: document.getElementById('prof-username').value.trim() };
            const p = document.getElementById('prof-new-password').value;
            try {
                if(p) { if(p.length < 6) throw new Error("太短"); await window.supabaseClient.auth.updateUser({ password: p }); }
                if(!userIsMember) {
                    d.custom_id = document.getElementById('prof-customid').value.trim();
                    d.county = document.getElementById('prof-county').value;
                    d.stage = document.getElementById('prof-stage').value;
                    d.school_id = document.getElementById('prof-school').value;
                }
                await window.supabaseClient.from('profiles').update(d).eq('id', currentUser.id);
                location.reload();
            } catch (e) { alert(e.message); }
        }

        async function processInvite(a) {
            if (a === 'accept') {
                if (!confirm("確定加入？")) return;
                await window.supabaseClient.from('organization_members').update({ status: 'active' }).eq('id', pendingInvite.id);
            } else await window.supabaseClient.from('organization_members').delete().eq('id', pendingInvite.id);
            location.reload();
        }

        async function removeM(u, m, o, i) {
            if (i) {
                if (confirm("刪除？")) await window.supabaseClient.rpc('admin_delete_managed_user', { target_user_id: u, target_org_id: o });
            } else if (confirm("移除？")) await window.supabaseClient.from('organization_members').delete().eq('id', m);
            location.reload();
        }

        function showAddArea(t) {
            const a = document.getElementById('add-form-area'); a.style.display = 'block';
            if (t === 'invite') a.innerHTML = `<label>User ID</label><div id="inv-msg" class="msg-box"></div><div style="display:flex; gap:10px;"><input type="text" id="inv-uid" class="form-control"><button class="btn" style="background:#10b981; color:white; border:none;" onclick="sendInv()">發送</button></div>`;
            else {
                a.innerHTML = `<label>預註冊帳號</label><div id="reg-msg" class="msg-box"></div><div class="form-group"><label>帳號 ID</label><input type="text" id="reg-m-customid" class="form-control"></div><div class="form-group"><label>顯示名稱</label><input type="text" id="reg-m-username" class="form-control"></div><div class="form-group"><label>初始密碼</label><input type="text" id="reg-m-password" class="form-control"></div><button class="btn btn-submit" style="background:var(--primary); color:white; border:none;" onclick="regManaged()">註冊</button>`;
            }
        }

        async function regManaged() {
            try {
                const { data: o } = await window.supabaseClient.from('organizations').select('id').eq('owner_id', currentUser.id).single();
                await window.supabaseClient.rpc('admin_create_managed_user', { target_custom_id: document.getElementById('reg-m-customid').value.trim(), target_password: document.getElementById('reg-m-password').value, target_username: document.getElementById('reg-m-username').value.trim(), target_org_id: o.id });
                location.reload();
            } catch (e) { alert(e.message); }
        }

        async function sendInv() {
            try {
                const { data: o } = await window.supabaseClient.from('organizations').select('id').eq('owner_id', currentUser.id).single();
                await window.supabaseClient.from('organization_members').insert([{ organization_id: o.id, user_id: document.getElementById('inv-uid').value.trim(), role: 'member', status: 'invited' }]);
                location.reload();
            } catch (e) { alert("邀請失敗"); }
        }

        async function deleteMyAccount() {
            const n = document.getElementById('prof-username').value;
            if (prompt(`輸入 [ ${n} ] 以確認：`) === n) {
                await window.supabaseClient.rpc('delete_own_user');
                await window.supabaseClient.auth.signOut();
                window.location.replace('auth/login.html');
            }
        }
        
        function closeMemberModal() { document.getElementById('edit-member-modal').style.display = 'none'; }
        async function handleLogout() { await window.supabaseClient.auth.signOut(); window.location.href = 'auth/login.html'; }
        function updateOrgConfig(oid, f, v) { window.supabaseClient.from('organizations').update({ [f]: v }).eq('id', oid).then(()=>location.reload()); }
        function triggerAvatarUpload() { document.getElementById('avatar-file-input').click(); }
        async function uploadAvatar(e) {
            const f = e.target.files[0]; if(!f) return;
            const p = `${currentUser.id}/avatar.${f.name.split('.').pop()}`;
            await window.supabaseClient.storage.from('avatars').upload(p, f, { upsert: true });
            const { data: { publicUrl } } = window.supabaseClient.storage.from('avatars').getPublicUrl(p);
            await window.supabaseClient.from('profiles').update({ avatar_url: publicUrl }).eq('id', currentUser.id);
            location.reload();
        }
        init();
    </script>
</body>
</html>
